# Labels a pull request from the paths in .github/labeler.yml.
# pull_request_target runs this file from main and does not check out the pull request.
# https://github.com/actions/labeler

name: Labeler
on: [pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    - uses: actions/labeler@v7
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        sync-labels: true
