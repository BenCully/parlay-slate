# Scans the commits added by a pull request. A finding fails the check.
# Findings are redacted. The report is not uploaded.
# This repo belongs to a personal account, so gitleaks-action does not need a license.
# An organization account needs a free GITLEAKS_LICENSE secret before this job will pass.
name: Secrets

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
